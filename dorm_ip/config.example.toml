# dorm-ip configuration. `dorm-ip init` writes this file for you (~/.config/dorm-ip/config.toml);
# edit it any time with `make edit-config`. These values are the defaults the wizard starts from.

[network]
interface     = "wlan0"
connection    = ""                    # nmcli connection name; empty = the active wifi connection
prefix        = 21
gateway       = "172.18.47.254"
ranges        = ["172.18.40.1-172.18.40.255", "172.18.41.1-172.18.41.255"]
exclude       = ["172.18.47.254"]     # never try these (the gateway)
prefer_unused = true                  # try IPs not seen in the ARP scan first (shared IPs are still tried)

[dns]
default            = ["172.18.32.1"]  # the dorm DNS
override           = ["8.8.8.8"]      # DNS that skips the portal's DNS redirect
hunt_with_override = true             # test candidates with the override DNS
final_mode         = "override"       # DNS kept after a hunt: override | default | auto

[tests]
ping_target       = "1.1.1.1"
ping_count        = 5
connectivity_url  = "http://connectivitycheck.gstatic.com/generate_204"
speed_url         = "https://speed.cloudflare.com/__down?bytes=5000000"
sustained_url     = ""                # empty = repeat speed_url for the whole sustained test
sustained_seconds = 8
sample_interval   = 0.5
dns_domains       = ["google.com", "cloudflare.com", "wikipedia.org"]
data_budget_mb    = 6000              # daily cap for test traffic, 0 = unlimited

[thresholds]
max_ping_ms         = 250
max_loss_pct        = 2
min_speed_mbps      = 8               # 8 Mbps = 1 MB/s
min_sustained_mbps  = 8
collapse_below_mbps = 1               # under this for >= 2 s counts as "speed collapsed"
speed_rule          = "either"        # either: quick OR sustained is enough | both: both must pass

[hunt]
max_candidates = 30
order          = "best-history"       # random | sequential | best-history
settle_seconds = 4                    # max wait for the gateway after a live IP switch (a reconnect waits longer)
live_change    = "auto"               # auto: switch IPs without reconnecting (verified, falls back) | off
skip_failed_minutes = 30              # don't retry a failed IP for this long (doubles per failure, 0 = off)
explore_near_good   = true            # best-history: try untested IPs next to known-good ones sooner
triage_batch        = 12              # filter this many candidates in parallel first (0 = one by one)
find                = 1               # IPs that must pass the full test; the best is kept, the rest are standby

[standby]
max_age_hours = 12                    # forget standby IPs older than this
failover      = true                  # the watchdog tries standby IPs before running a full hunt

[watchdog]
interval_seconds        = 30
probe_bytes             = 200000
bad_checks_to_rehunt    = 3
notify                  = true
min_probe_mbps          = 1.0         # a 200 KB probe is dominated by TCP slow start
rehunt_cooldown_seconds = 300         # doubles after each failed re-hunt, max 30 min
busy_mbps               = 2.0         # slow probe + your own traffic above this = ignored (0 = off)

[portal]
enabled              = false          # `dorm-ip init` turns this on once it has your credentials
mode                 = "flow"         # flow: follow the portal's own login page | replay: send the request below
url                  = ""
method               = "POST"
content_type         = "form"         # form | json
fields               = {}
query                = {}
headers              = {}
success_contains     = ""
failure_contains     = ""
credentials_file     = "~/.config/dorm-ip/credentials.toml"
keyring_service      = ""
login_during_hunt    = true           # log in on candidates that show the portal
max_logins_per_hunt  = 10
resolve_via_dorm_dns = true           # resolve the portal host through dns.default, even on override DNS
host_ip              = ""             # fixed portal IP, if its name does not resolve
form_username_field  = ""             # flow mode: only if the login page has no parsable form
form_password_field  = ""
post_path            = ""
post_drop_params     = ["reason"]
verify_tls           = true
timeout              = 10
