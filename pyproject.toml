[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-hunter"
version = "0.1.0"
description = "Find a fast, stable static IP on the dorm network"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pytest>=9.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dorm-ip = "dorm_ip.cli:main"

[tool.setuptools]
packages = ["dorm_ip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
