[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorm-ip"
version = "0.4.0"
description = "Find and keep a fast, stable static IP on a captive-portal dorm wifi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "click",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dorm-ip = "dorm_ip.cli:main"

[tool.setuptools]
packages = ["dorm_ip"]

[tool.setuptools.package-data]
dorm_ip = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
