name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run the tests
        run: uv run pytest -q

      - name: The command line starts
        run: |
          uv run dorm-ip --version
          uv run dorm-ip --help
          uv run dorm-ip init --help

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the wheel
        run: uv build
      - name: The packaged config template is included
        run: |
          unzip -l dist/*.whl | grep -q 'dorm_ip/config.example.toml'
          unzip -l dist/*.whl | grep -q 'dorm_ip/cli.py'
